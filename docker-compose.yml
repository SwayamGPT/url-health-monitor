services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    container_name: url-monitor-backend

    ports:
      - "8080:8000"
   
    env_file:
      - .env

    environment:
      sql_url: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      secret_key: "${secret_key}"
      algorithm: "${algorithm}"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  frontend:
      build:
        context: .
        dockerfile: Dockerfile
        target: frontend
      container_name: url-monitor-frontend  

      ports:
        - "3000:80"
     
      env_file:
        - .env

      environment:
        VITE_API_URL: "${VITE_API_URL}"
        
      depends_on:
        - backend
        
      restart: unless-stopped
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
      postgres_data:
