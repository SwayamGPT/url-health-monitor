services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    container_name: url-monitor-backend

    ports: "8080:8080"

    environment:
      sql_url: postgresql+asyncpg://{postgres_user}:{postgres_password}@db:5432/{postgres_db}
      secret_key: {secret_key}
      algorithm: {algorithm}

    depends_on:
      db:
      condition: service_healthy

    restart: unless-stopped

  frontend:
      build:
      context: .
      dockerfile: Dockerfile
      target: frontend

      container_name: url-monitor-frontend  

      ports: "3000:80"

      depends_on:
      - backend

      restart: unless-stopped

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: {postgres_user}
      POSTGRES_PASSWORD: {postgres_password}
      POSTGRES_DB: {postgres_db}

    ports: "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
